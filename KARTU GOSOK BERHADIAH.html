
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Gosok HIHU</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
}

h1 {
    color: #facc15;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 35px;
}

.card {
    position: relative;
    width: 100%;
    max-width: 300px;
    height: 170px;
    border-radius: 15px;
    overflow: hidden;
    background: linear-gradient(135deg, #f97316, #ec4899);
}

.result {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

.notification {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.popup {
    background: white;
    color: #1e293b;
    padding: 30px;
    border-radius: 20px;
    width: 100%;
    max-width: 320px;
    animation: muncul 0.3s ease;
}

.popup h2 {
    color: #16a34a;
}

.popup p {
    color: #475569;
}

.popup button {
    border: none;
    background: #16a34a;
    color: white;
    padding: 12px 25px;
    border-radius: 10px;
    font-size: 16px;
}

@keyframes muncul {
    from {
        transform: scale(0.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

</style>
</head>

<body>

<h1>KARTU GOSOK</h1>
<p>Gosok salah satu kartu untuk mendapatkan hadiah!</p>

<div class="container">

    <div class="card">
        <div class="result">HIHU!</div>
        <canvas></canvas>
    </div>

    <div class="card">
        <div class="result">HIHU!</div>
        <canvas></canvas>
    </div>

    <div class="card">
        <div class="result">HIHU!</div>
        <canvas></canvas>
    </div>

</div>

<!-- NOTIFIKASI -->
<div class="notification" id="notification">
    <div class="popup">
        <h2>SELAMAT!</h2>
        <p>Kamu berhasil mendapatkan HIHU!</p>
        <button onclick="tutupNotif()">Tutup</button>
    </div>
</div>

<script>

// Mengambil semua canvas
const canvases = document.querySelectorAll("canvas");

// Fungsi notifikasi
function tampilNotif() {
    document.getElementById("notification").style.display = "flex";
}

function tutupNotif() {
    document.getElementById("notification").style.display = "none";
}

// Membuat masing-masing kartu
canvases.forEach(canvas => {

    const ctx = canvas.getContext("2d");

    canvas.width = 520;
    canvas.height = 340;

    let drawing = false;
    let completed = false;

    // Membuat lapisan penutup
    const gradient = ctx.createLinearGradient(
        0, 0, 520, 340
    );

    gradient.addColorStop(0, "#94a3b8");
    gradient.addColorStop(1, "#475569");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 520, 340);

    ctx.fillStyle = "white";
    ctx.font = "bold 35px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("GOSOK DI SINI", 260, 170);

    // Fungsi menggosok
    function scratch(e) {

        if (!drawing || completed) return;

        const rect = canvas.getBoundingClientRect();

        const x = (e.clientX - rect.left) *
                  canvas.width / rect.width;

        const y = (e.clientY - rect.top) *
                  canvas.height / rect.height;

        ctx.globalCompositeOperation = "destination-out";

        ctx.beginPath();
        ctx.arc(x, y, 28, 0, Math.PI * 2);
        ctx.fill();
    }

    // Menghitung bagian yang terhapus
    function checkProgress() {

        const image = ctx.getImageData(
            0, 0, canvas.width, canvas.height
        );

        let erased = 0;
        let total = 0;

        // Memeriksa setiap 8 piksel
        for (let y = 0; y < canvas.height; y += 8) {

            for (let x = 0; x < canvas.width; x += 8) {

                const index = (y * canvas.width + x) * 4;

                total++;

                if (image.data[index + 3] === 0) {
                    erased++;
                }
            }
        }

        const percentage = (erased / total) * 100;

        // Jika sudah 50% terhapus
        if (percentage >= 50 && !completed) {

            completed = true;

            canvas.style.display = "none";

            tampilNotif();
        }
    }

    // Event sentuhan dan mouse
    canvas.addEventListener("pointerdown", e => {

        if (completed) return;

        drawing = true;

        canvas.setPointerCapture(e.pointerId);

        scratch(e);
    });

    canvas.addEventListener("pointermove", scratch);

    canvas.addEventListener("pointerup", () => {

        drawing = false;

        checkProgress();
    });

    canvas.addEventListener("pointercancel", () => {

        drawing = false;

        checkProgress();
    });

});

</script>

</body>
</html>
